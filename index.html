<style>
/* ── Drawer latéral ── */
#ov{position:fixed;inset:0;background:transparent;z-index:90;pointer-events:none;transition:background .25s;}
#ov.open{background:rgba(0,0,0,.65);pointer-events:all;backdrop-filter:blur(2px);}
#drawer{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:82vw;background:#141414;border-right:1px solid #2e2e2e;z-index:200;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .28s cubic-bezier(.32,.72,0,1);overflow:hidden;}
#drawer.open{transform:translateX(0);}
@media(min-width:430px){#drawer{left:calc(50vw - 215px);}#ov{max-width:430px;left:50%;transform:translateX(-50%);}#ov.open{transform:translateX(-50%);}}
.dr-brand{display:flex;align-items:center;gap:10px;padding:52px 16px 14px;border-bottom:1px solid #2e2e2e;flex-shrink:0;}
.dr-logo{width:36px;height:36px;background:linear-gradient(135deg,#FF6B35,#FF3366);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.dr-name-s{font-size:11px;font-weight:900;color:#444;letter-spacing:.5px;}
.dr-name-s span{color:#FF6B35;}
.dr-resto{font-size:15px;font-weight:800;color:#f0ede8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dr-nav{flex:1;overflow-y:auto;padding:8px 10px;scrollbar-width:none;}
.dr-nav::-webkit-scrollbar{display:none;}
.dr-gl{font-size:9px;font-weight:800;color:#444;text-transform:uppercase;letter-spacing:1.5px;padding:13px 8px 4px;}
.dr-btn{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;color:#888;font-size:13px;font-weight:600;width:100%;text-align:left;position:relative;transition:background .12s,color .12s;background:none;border:none;cursor:pointer;font-family:inherit;}
.dr-btn:active{background:#242426;}
.dr-btn.act{background:rgba(255,107,53,.1);color:#FF6B35;font-weight:700;}
.dr-btn.act::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:0 2px 2px 0;background:#FF6B35;}
.dr-ico{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:15px;flex-shrink:0;}
.dr-btn.act .dr-ico{background:rgba(255,107,53,.12);}
.dr-sep{height:1px;background:#2e2e2e;margin:5px 8px;}
.dr-foot{padding:10px;border-top:1px solid #2e2e2e;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.dr-action{width:100%;padding:11px 14px;background:rgba(255,107,53,.06);border:1px solid rgba(255,107,53,.15);border-radius:11px;color:#FF6B35;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;font-family:inherit;}
.dr-action.deco{background:rgba(255,68,68,.06);border-color:rgba(255,68,68,.15);color:#ff6666;}
/* ── Bouton header ── */
.hdr-tog{background:#1a1a1a;border:1px solid #2e2e2e;border-radius:10px;width:38px;height:38px;min-width:38px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0;color:#f0ede8;padding:0;}
/* ── Icône thème ── */
.lt-ic{display:none;}
body.light .dk-ic{display:none;}
body.light .lt-ic{display:inline;}
/* ── Mode clair ── */
body.light{background:#f2f1ec!important;color:#1a1a1a;}
body.light::before{background:#f2f1ec!important;}
body.light #app{background:#f2f1ec!important;}
html:has(body.light){background:#f2f1ec!important;}
body.light .header{background:#ffffff!important;border-color:#ddd!important;}
body.light .bottom-nav{background:#ffffff!important;border-color:#ddd!important;}
body.light .card{background:#eae9e4!important;border-color:#d8d5d0!important;}
body.light .sc{background:#eae9e4!important;border-color:#d8d5d0!important;}
body.light .modal-sh{background:#f2f1ec!important;border-color:#d8d5d0!important;}
body.light .mhandle{background:#ccc!important;}
body.light .input{background:#ffffff!important;border-color:#d8d5d0!important;color:#1a1a1a!important;}
body.light .btn-o{border-color:#d8d5d0!important;color:#1a1a1a!important;}
body.light .stab{background:#eae9e4!important;border-color:#d8d5d0!important;color:#666!important;}
body.light .muted{color:#777!important;}
body.light .slabel{color:#888!important;}
body.light .logo-text{color:#888!important;}
body.light .logo-sub{color:#1a1a1a!important;}
body.light .nav-btn .nl{color:#999!important;}
body.light .tag{background:#eae9e4!important;color:#666!important;}
body.light #drawer{background:#ffffff!important;border-color:#ddd!important;}
body.light .dr-btn{color:#666!important;}
body.light .dr-btn.act{color:#FF6B35!important;background:rgba(255,107,53,.08)!important;}
body.light .dr-btn.act::before{background:#FF6B35!important;}
body.light .dr-gl{color:#aaa!important;}
body.light .dr-sep{background:#ddd!important;}
body.light .dr-brand{border-color:#ddd!important;}
body.light .dr-foot{border-color:#ddd!important;}
body.light .dr-name-s{color:#aaa!important;}
body.light .dr-resto{color:#1a1a1a!important;}
body.light .hdr-tog{background:#f0ede8!important;border-color:#ddd!important;color:#1a1a1a!important;}
body.light .dr-action{background:rgba(255,107,53,.06)!important;border-color:rgba(255,107,53,.2)!important;}
body.light .spin{border-color:#ddd!important;border-top-color:#FF6B35!important;}
</style>

async function hashPwd(pwd){const encoder=new TextEncoder();const data=encoder.encode(pwd+'restoapp_salt_2024');const hashBuffer=await crypto.subtle.digest('SHA-256',data);const hashArray=Array.from(new Uint8Array(hashBuffer));return hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');}

async function register(){const n=document.getElementById('rn').value.trim();const e=document.getElementById('re').value.trim();const p=document.getElementById('rp').value.trim();if(!n||!e||!p)return toast('Remplissez tous les champs',true);if(n.length>50)return toast('Nom trop long (50 car. max)',true);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e))return toast('Email invalide',true);if(p.length<6)return toast('Mot de passe trop court (6 car. min)',true);if(p.length>50)return toast('Mot de passe trop long',true);if(!document.getElementById('cgv-check').checked)return toast('Acceptez les CGV pour continuer',true);if(firestore_ready){try{await firebase.auth().createUserWithEmailAndPassword(e,p);}catch(authErr){if(authErr.code==='auth/email-already-in-use')return toast('Email déjà utilisé',true);return toast('Erreur: '+authErr.message,true);}}else if(D.restaurants.find(r=>r.email===e))return toast('Email déjà utilisé',true);const pHash=await hashPwd(p);const r={id:uid(),nom:n,email:e,pwd:pHash,created_at:Date.now(),trial_end:Date.now()+15*24*60*60*1000};D.restaurants.push(r);if(firestore_ready)await fbSet('restaurants',r.id,r);demoData(r.id);save();S={id:r.id,nom:r.nom,email:r.email};ss('rapp_s',S);const restos=D.restaurants.filter(r2=>r2.compte_id===r.id||r2.id===r.id);if(restos.length>1){renderSelectResto();toast('Bienvenue ! 👋');return;}

e=parsed.emoji;if(parsed.unite)document.getElementById('stock-unite').value=parsed.unite;if(parsed.cat)document.getElementById('stock-cat').value=parsed.cat;if(parsed.fournisseur&&F.length){const matched=F.find(f=>f.nom.toLowerCase()===parsed.fournisseur.toLowerCase())||F.find(f=>f.nom.toLowerCase().includes(parsed.fournisseur.toLowerCase())||parsed.fournisseur.toLowerCase().includes(f.nom.toLowerCase()));if(matched){const sel=document.getElementById('stock-fid');if(sel)sel.value=matched.id;}}toast('Produit identifié ✅');}else toast('Photo ajoutée — vérifiez les informations');}catch(e){toast('Photo ajoutée');}}

function importCSV(input,type){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){const lines=e.target.result.trim().split('\n').filter(l=>l.trim());if(lines.length<2){toast('Fichier vide ou invalide',true);return;}
const headers=lines[0].split(',').map(h=>h.trim().toLowerCase());const rows=lines.slice(1).map(l=>{const vals=l.split(',').map(v=>v.trim());const obj={};headers.forEach((h,i)=>obj[h]=vals[i]||'');return obj;});if(type==='stocks'){let importés=0,màj=0;rows.forEach(r=>{const nom=r['nom']||r['name']||r['produit']||'';const qte=parseFloat(r['quantite']||r['quantité']||r['qty']||0);const unite=r['unite']||r['unité']||r['unit']||'unité';const seuil=parseFloat(r['seuil']||r['seuil_alerte']||r['min']||0);if(!nom)return;const rid=getRid();const exist=D.stocks.find(s=>s.nom.toLowerCase()===nom.toLowerCase()&&(s.restaurant_id===rid||s.rid===rid));if(exist){exist.stock=qte;exist.qte=qte;exist.seuil=seuil;exist.unite=unite;màj++;}else{D.stocks.push({id:uid(),restaurant_id:rid,nom,stock:qte,qte,unite,seuil,emoji:'📦',cat:'cuisine'});importés++;}});save();const prev=document.getElementById('previewStocks');prev.style.display='block';prev.innerHTML=`<div style="background:#0a1a0a;border:1px solid #25D36633;border-radius:10px;padding:12px;font-size:12px;color:#25D366;font-weight:700">✅ ${importés} produit(s) ajouté(s), ${màj} mis à jour</div>`;toast('Stocks importés avec succès !');}else if(type==='factures'){let importées=0;rows.forEach(r=>{const date=r['date']||new Date().toISOString().split('T')[0];const fournisseur=r['fournisseur']||r['supplier']||r['fournisseur']||'Import caisse';const desc=r['description']||r['libelle']||r['libellé']||'';const montant=parseFloat(r['montant']||r['amount']||r['total']||0);if(!montant)return;const rid=getRid();let four=D.fournisseurs.find(f=>f.nom.toLowerCase()===fournisseur.toLowerCase()&&(f.restaurant_id===rid||f.rid===rid));if(!four){four={id:uid(),restaurant_id:rid,nom:fournisseur,cat:'Import caisse',emoji:'🏪',type:'cuisine',contact:'',email:''};D.fournisseurs.push(four);}
D.factures.push({id:uid(),restaurant_id:rid,fid:four.id,date,desc,montant,type:'Facture',statut:'Payée',created_at:Date.now()});importées++;});save();const prev=document.getElementById('previewFact');prev.style.display='block';prev.innerHTML=`<div style="background:#0a1a0a;border:1px solid #25D36633;border-radius:10px;padding:12px;font-size:12px;color:#25D366;font-weight:700">✅ ${importées} facture(s) importée(s)</div>`;toast('Factures importées avec succès !');}};reader.readAsText(file);}

function mCmd(){return D.commandes?D.commandes.filter(c=>c.rid===getRid()):[];}
function joursRestants(dlc){if(!dlc)return null;const diff=Math.ceil((new Date(dlc)-new Date())/(1000*60*60*24));return diff;}
function statutDLC(t){const j=joursRestants(t.dlc);if(j===null)return'unknown';if(t.statut==='expiré'||j<0)return'expire';if(j===0)return'today';if(j<=2)return'urgent';if(t.statut==='ouvert')return'ouvert';return'ok';}
function couleurStatut(s){return{expire:'#ff4444',today:'#FF6B35',urgent:'#FFB347',ouvert:'#64B5F6',ok:'#4CAF50',unknown:'#666'}[s]||'#666';}

function prochainRappel(cmd){const jours=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];const today=new Date();const todayIdx=today.getDay();const cibleIdx=jours.indexOf(cmd.jourFixe);if(cibleIdx===-1)return null;let diff=cibleIdx-todayIdx;if(diff<0)diff+=7;const prochaine=new Date(today);prochaine.setDate(today.getDate()+diff);return{diff,date:prochaine.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})};}

function rDLC(T){const cats=[...new Set(T.map(t=>t.cat||'Autre'))];const filtre=N.filtrecat||'Tous';const affich=filtre==='Tous'?T:T.filter(t=>(t.cat||'Autre')===filtre);affich.sort((a,b)=>{const ja=joursRestants(a.dlc)??999;const jb=joursRestants(b.dlc)??999;return ja-jb;});return`

async function scanDLC(input){const file=input.files[0];if(!file)return;_photoDLC=null;_photoDLCType=null;const dlcZone=document.querySelector('#dlc-photo-prev')?.previousElementSibling;if(dlcZone)dlcZone.style.display='none';document.getElementById('dlc-scan-st').style.display='block';if(isPdfFile(file)){const dataUrl=await lireFichierDataUrl(file);_photoDLC=dataUrl;_photoDLCType='pdf';document.getElementById('dlc-scan-st').style.display='none';previewPieceJointe('dlc-photo-prev',dataUrl,'pdf','PDF scanné ajouté');toast('PDF scanné ajouté — remplissez les champs manuellement');return;}
_photoDLCType='image';const dataUrl=await new Promise((res,rej)=>{const reader=new FileReader();reader.onload=(e)=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const MAX=800;let w=img.width,h=img.height;if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);res(canvas.toDataURL('image/jpeg',0.7));};img.src=e.target.result;};reader.onerror=rej;reader.readAsDataURL(file);});const b64=dataUrl.split(',')[1];_photoDLC=dataUrl;try{const resp=await fetch('https://resto-ap.netlify.app/.netlify/functions/ai-proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-opus-4-8',max_tokens:300,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data:b64}},{type:'text',text:'Analyse cette étiquette produit alimentaire. Réponds UNIQUEMENT en JSON: {"nom":"...","lot":"...","dlc":"YYYY-MM-DD","cat":"Viandes|Poissons|Laitiers|Épicerie|Légumes|Autre"}. La date doit être au format YYYY-MM-DD.'}]}]})});const data=await resp.json();const text=data.content?.map(c=>c.text||'').join('')||'';let parsed=null;try{parsed=JSON.parse(text.replace(/```json|```/g,'').trim());}catch{}
document.getElementById('dlc-scan-st').style.display='none';if(parsed){if(parsed.nom)document.getElementById('dlc-nom').value=parsed.nom;if(parsed.lot)document.getElementById('dlc-lot').value=parsed.lot;if(parsed.dlc)document.getElementById('dlc-date').value=parsed.dlc;if(parsed.cat)document.getElementById('dlc-cat').value=parsed.cat;}
document.getElementById('dlc-photo-prev').innerHTML=`<img src="${dataUrl}" style="width:100%;max-height:130px;object-fit:cover;border-radius:12px;margin-bottom:12px;border:2px solid #4CAF5066">`;if(parsed)toast('Étiquette analysée ✅');else toast('Photo ajoutée — remplissez les champs manuellement');}catch(e){document.getElementById('dlc-scan-st').style.display='none';if(dlcZone)dlcZone.style.display='grid';if(_photoDLC)document.getElementById('dlc-photo-prev').innerHTML=`<img src="${_photoDLC}" style="width:100%;max-height:130px;object-fit:cover;border-radius:12px;margin-bottom:12px">`;toast('Remplissez manuellement',true);}}

:10px;color:#999;text-align:center}@media print{.toolbar{display:none!important}.doc{padding:10px}}</style></head><body>

function dupliquerFact(id){const f=D.factures.find(x=>x.id===id);if(!f)return;const copy={...f,id:uid(),date:new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}),created_at:Date.now(),statut:'En attente'};D.factures.unshift(copy);save();cModal();render();toast('Facture dupliquée ✅');}

function mPaie(eid){return`<div class="mtitle">💶 Ajouter une fiche de paie</div><div class="muted" style="font-size:12px;margin-bottom:10px">Choisissez le mois et ajoutez une photo, un scan, une image ou un PDF.</div><input class="input" id="pmois" type="month" value="${new Date().toISOString().slice(0,7)}"><input type="file" id="pfile" accept=".pdf,image/*" style="display:none" onchange="previewPaieFile(this)"><input type="file" id="pphoto" accept="image/*" capture="environment" style="display:none" onchange="previewPaieFile(this)"><input type="file" id="pgal" accept="image/*" style="display:none" onchange="previewPaieFile(this)"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px"><button class="btn btn-o" onclick="document.getElementById('pphoto').click()">📸 Photo</button><button class="btn btn-o" onclick="if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.scanDocument){window._paieScanEmp='${eid}';window.webkit.messageHandlers.scanDocument.postMessage('paie')}else document.getElementById('pphoto').click()">📄 Scan</button><button class="btn btn-o" onclick="document.getElementById('pgal').click()">🖼️ Galerie</button></div><button class="btn btn-o" onclick="document.getElementById('pfile').click()">📎 Fichier PDF</button><div id="paiePreview" class="muted" style="font-size:12px;margin:10px 0">Aucun fichier sélectionné</div><button class="btn btn-p" onclick="addPaie('${eid}')">Ajouter</button><button class="btn btn-o" onclick="cModal()">Annuler</button>`;}
function previewPaieFile(input){const file=input.files[0];if(!file)return;const pv=document.getElementById('paiePreview');if(pv)pv.innerHTML='✅ '+file.name;window._paieFileInput=input.id;}
function addPaie(eid){const input=document.getElementById(window._paieFileInput||'pfile');const file=input?.files?.[0];if(!file)return toast('Ajoute une photo ou un PDF',true);const e=D.employes.find(x=>x.id===eid);if(!e)return;const r=new FileReader();r.onload=ev=>{if(!e.paies)e.paies=[];const mois=document.getElementById('pmois').value||new Date().toISOString().slice(0,7);e.paies.push({mois,name:file.name,type:file.type.includes('pdf')?'pdf':'img',date:new Date().toLocaleDateString('fr-FR'),data:ev.target.result});save();cModal();render();toast('Fiche de paie ajoutée ✅');};r.readAsDataURL(file);}

function remplacerPaie(eid,i){cModal();const input=document.createElement('input');input.type='file';input.accept='.pdf,image/*';input.style.display='none';input.onchange=function(){const file=input.files[0];if(!file)return;const e=D.employes.find(x=>x.id===eid);const r=new FileReader();r.onload=ev=>{e.paies[i]={...(e.paies[i]||{}),name:file.name,type:file.type.includes('pdf')?'pdf':'img',date:new Date().toLocaleDateString('fr-FR'),data:ev.target.result};save();render();toast('Fiche remplacée ✅');input.remove();};r.readAsDataURL(file);};document.body.appendChild(input);input.click();}
function supprimerPaie(eid,i){const e=D.employes.find(x=>x.id===eid);if(!e||!e.paies)return;e.paies.splice(i,1);save();cModal();render();toast('Fiche supprimée');}
function ouvrirScanner(inputId){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.style.display='none';document.body.appendChild(inp);const original=document.getElementById(inputId);inp.onchange=(e)=>{const dt=new DataTransfer();if(e.target.files[0])dt.items.add(e.target.files[0]);original.files=dt.files;original.dispatchEvent(new Event('change'));document.body.removeChild(inp);};inp.click();}
function calcTTC(){const ht=parseFloat(document.getElementById('fmnt')?.value);const tva=parseFloat(document.getElementById('ftva')?.value||0);const prev=document.getElementById('ttc-preview');if(!prev)return;if(isNaN(ht)||ht<=0){prev.style.display='none';return;}

async function addPointageManuel(eid){const date=document.getElementById('ptg-date')?.value;const arr=document.getElementById('ptg-arr')?.value;const dep=document.getElementById('ptg-dep')?.value;const note=document.getElementById('ptg-note')?.value||'';if(!date||!arr)return toast('Date et arrivée requis',true);const[h1,m1]=arr.split(':').map(Number);if(dep){const[h2,m2]=dep.split(':').map(Number);if(h2*60+m2<=h1*60+m1)return toast('Départ doit être après arrivée',true);}

utton onclick="const i=document.getElementById('cq-${s.id}');i.value=Math.max(0,parseInt(i.value||0)-1)" style="width:28px;height:28px;background:#222;border:1px solid #2e2e2e;border-radius:8px;color:#aaa;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center">-</button><input id="cq-${s.id}" type="number" min="0" value="${manque}" style="width:48px;text-align:center;background:#111;border:1px solid #2e2e2e;border-radius:8px;color:#f0ede8;font-size:13px;font-weight:700;padding:4px 2px"><button onclick="const i=document.getElementById('cq-${s.id}');i.value=parseInt(i.value||0)+1" style="width:28px;height:28px;background:#222;border:1px solid #2e2e2e;border-radius:8px;color:#aaa;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center">+</button><span style="font-size:10px;color:#555">${s.unite||'u.'}</span></div></div>`;}).join('')}${!isNone?`<button class="btn btn-p" style="margin-top:12px" onclick="creerBonCommande('${dateLiv}','${key}')">📋 Bon de commande — ${four?.nom||'?'}</button>`:`<div style="background:#111;border-radius:10px;padding:10px;margin-top:10px;font-size:11px;color:#555;text-align:center">→ Stocks > modifier le produit > assigner un fournisseur</div>`}</div>`}).join('')}
<button class="btn btn-p" onclick="creerBonCommande('${dateLiv}','__all__')" style="margin-bottom:14px;background:#FF6B35;border-color:#FF6B35">📋 Bon de commande global</button>`}

function creerBonCommande(dateLiv,fid){
if(window._creatingBon)return;window._creatingBon=true;setTimeout(()=>{window._creatingBon=false;},2000);
if(!D.bons_commande)D.bons_commande=[];
const stocks=mS(),fours=mF();
let items=stocks.filter(s=>s.stock<=s.seuil);
if(fid&&fid!=='__all__')items=items.filter(s=>s.fid===fid);
const bonItems=items.map(s=>{const four=fours.find(f=>f.id===s.fid);const inputEl=document.getElementById('cq-'+s.id);const qte=inputEl?parseFloat(inputEl.value)||0:Math.max(1,Math.ceil(s.seuil*2-s.stock));return{stockId:s.id,nom:s.nom,emoji:s.emoji||'📦',qteActuelle:s.stock,seuil:s.seuil,qteCommande:qte,unite:s.unite||'u.',fid:s.fid||'',fournisseur:four?.nom||'Non défini',fournisseurEmoji:four?.emoji||'🏪'};}).filter(i=>i.qteCommande>0);
if(!bonItems.length)return toast('Aucun article à commander',true);
const bon={id:uid(),rid:getRid(),date:new Date().toLocaleDateString('fr-FR'),dateLiv,createdAt:Date.now(),items:bonItems,fid:fid==='__all__'?null:fid};
D.bons_commande.push(bon);save();render();toast('Bon créé ✅');oModal(voirBonCommande(bon.id));
}

function envoyerBonMail(id){
const bon=(D.bons_commande||[]).find(b=>b.id===id);
if(!bon)return;
const fours=mF();
const resto=S.restoNom||S.nom||'Restaurant';
const byFour={};bon.items.forEach(i=>{const k=i.fid||'__none__';if(!byFour[k])byFour[k]=[];byFour[k].push(i);});
const fourIds=Object.keys(byFour).filter(k=>k!=='__none__');
if(fourIds.length===1){
  const four=fours.find(f=>f.id===fourIds[0]);
  const email=four?.email||'';
  const lignes=byFour[fourIds[0]].map(i=>`- ${i.emoji||''} ${i.nom} : ${i.qteCommande} ${i.unite}`).join('%0A');
  const sujet=encodeURIComponent(`Commande ${resto} — livraison le ${bon.dateLiv}`);
  const corps=encodeURIComponent(`Bonjour,\n\nVeuillez trouver ci-dessous notre commande pour livraison le ${bon.dateLiv} :\n\n`)+lignes+encodeURIComponent(`\n\nCordialement,\n${resto}`);
  window.location.href=`mailto:${email}?subject=${sujet}&body=${corps}`;
}else{
  const lignes=bon.items.map(i=>`- ${i.emoji||''} ${i.nom} (${i.fournisseur}) : ${i.qteCommande} ${i.unite}`).join('%0A');
  const sujet=encodeURIComponent(`Commande ${resto} — livraison le ${bon.dateLiv}`);
  const corps=encodeURIComponent(`Bonjour,\n\nVeuillez trouver ci-dessous notre commande pour livraison le ${bon.dateLiv} :\n\n`)+lignes+encodeURIComponent(`\n\nCordialement,\n${resto}`);
  window.location.href=`mailto:?subject=${sujet}&body=${corps}`;
}}

<div><div style="font-size:11px;color:#FF6B35;font-weight:700;margin-bottom:5px">Quantité</div><input class="input" id="ing-qte" type="number" step="0.01" min="0" value="1" style="margin:0"></div>
<div><div style="font-size:11px;color:#FF6B35;font-weight:700;margin-bottom:5px">Unité</div><input class="input" id="ing-unite" placeholder="kg, L, g..." style="margin:0"></div>
</div>
<button class="btn btn-p" onclick="addIngredient('${recId}')">✅ Ajouter</button>
<button class="btn btn-o" onclick="cModal()">Annuler</button>`;}

function addRecette(){const nom=document.getElementById('rec-nom').value.trim();if(!nom)return toast('Nom requis',true);if(!D.recettes)D.recettes=[];D.recettes.push({id:uid(),rid:getRid(),nom,emoji:document.getElementById('rec-emoji').value.trim()||'🍽️',portions:parseInt(document.getElementById('rec-portions').value)||4,note:document.getElementById('rec-note').value.trim(),ingredients:[]});save();cModal();render();toast('Recette créée ✅');}
function saveEditRecette(id){const rec=(D.recettes||[]).find(r=>r.id===id);if(!rec)return;rec.nom=document.getElementById('rec-nom').value.trim();rec.emoji=document.getElementById('rec-emoji').value.trim()||'🍽️';rec.portions=parseInt(document.getElementById('rec-portions').value)||4;rec.note=document.getElementById('rec-note').value.trim();save();cModal();render();toast('Recette modifiée ✅');}
function addIngredient(recId){const rec=(D.recettes||[]).find(r=>r.id===recId);if(!rec)return;const stockId=document.getElementById('ing-stock').value;const nom=document.getElementById('ing-nom').value.trim();const qte=parseFloat(document.getElementById('ing-qte').value)||0;const unite=document.getElementById('ing-unite').value.trim();if(!stockId&&!nom)return toast('Sélectionnez un produit ou entrez un nom',true);if(!rec.ingredients)rec.ingredients=[];const s=mS().find(x=>x.id===stockId);rec.ingredients.push({stockId:stockId||null,nom:nom||s?.nom||'',qte,unite:unite||s?.unite||'u.'});save();cModal();N.sel=recId;render();toast('Ingrédient ajouté ✅');}
function delIngredient(recId,i){const rec=(D.recettes||[]).find(r=>r.id===recId);if(!rec)return;rec.ingredients.splice(i,1);save();render();toast('Ingrédient supprimé');}
function delRecette(id){D.recettes=(D.recettes||[]).filter(r=>r.id!==id);save();N.sel=null;go('recettes');toast('Recette supprimée');}

// NOTES DE SERVICE
// ══════════════════════════════════════════════════
function rNotes(){const rid=getRid();const notes=(D.notes_service||[]).filter(n=>n.rid===rid).slice().sort((a,b)=>b.createdAt-a.createdAt);return`${btnRetour('Accueil')}<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div><div style="font-size:22px;font-weight:900">📢 Notes de service</div><div class="muted" style="font-size:12px">Annonces pour l'équipe</div></div><button class="btn btn-p" onclick="oModal(mAddNote())">+ Note</button></div>
${notes.length===0?`<div class="card" style="text-align:center;padding:40px"><div style="font-size:48px;margin-bottom:12px">📢</div><div style="font-size:16px;font-weight:800;margin-bottom:6px">Aucune note</div><div class="muted" style="font-size:13px;margin-bottom:16px">Publiez des annonces visibles par toute l'équipe</div><button class="btn btn-p" onclick="oModal(mAddNote())">+ Créer une note</button></div>`:notes.map((n,i)=>`<div style="background:${n.urgent?'#2a1500':'#1a1a1a'};border:1px solid ${n.urgent?'#FF6B3544':'#2e2e2e'};border-radius:16px;padding:14px;margin-bottom:10px"><div style="display:flex;align-items:flex-start;gap:10px"><div style="font-size:26px;flex-shrink:0">${n.emoji||'📢'}</div><div style="flex:1"><div style="font-size:13px;font-weight:700;color:${n.urgent?'#FF6B35':'#f0ede8'};line-height:1.5">${n.urgent?'🔴 URGENT — ':''}${n.texte}</div><div style="font-size:10px;color:#555;margin-top:6px">${n.date} · ${n.auteur||'Patron'}</div></div><button onclick="delNote('${n.id}')" style="background:none;border:none;color:#555;font-size:16px;cursor:pointer;flex-shrink:0;padding:0 4px">×</button></div></div>`).join('')}`;}

function mAddNote(){return`<div class="mtitle">📢 Nouvelle note de service</div>
<div style="display:grid;grid-template-columns:52px 1fr;gap:10px;margin-bottom:10px"><input class="input" id="note-emoji" value="📢" style="text-align:center;font-size:20px;margin:0"><input class="input" id="note-auteur" placeholder="Votre nom" style="margin:0" value="${S?.nom||'Patron'}"></div>
<div style="font-size:11px;color:#FF6B35;font-weight:700;margin-bottom:6px">Message</div>
<textarea class="input" id="note-texte" placeholder="Écrivez votre annonce..." style="min-height:80px;resize:vertical"></textarea>
<label style="display:flex;align-items:center;gap:10px;background:#2a1500;padding:12px;border-radius:12px;cursor:pointer;margin-bottom:4px"><input type="checkbox" id="note-urgent" style="width:18px;height:18px;accent-color:#FF6B35"><span style="font-size:13px;font-weight:700;color:#FF6B35">🔴 Marquer comme urgent</span></label>
<button class="btn btn-p" onclick="addNote()">📢 Publier</button>
<button class="btn btn-o" onclick="cModal()">Annuler</button>`;}

function addNote(){const texte=document.getElementById('note-texte').value.trim();if(!texte)return toast('Message requis',true);if(!D.notes_service)D.notes_service=[];D.notes_service.push({id:uid(),rid:getRid(),texte,emoji:document.getElementById('note-emoji').value.trim()||'📢',auteur:document.getElementById('note-auteur').value.trim()||'Patron',urgent:document.getElementById('note-urgent').checked,date:new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long'}),createdAt:Date.now()});save();cModal();render();toast('Note publiée 📢');}
function delNote(id){D.notes_service=(D.notes_service||[]).filter(n=>n.id!==id);save();render();toast('Note supprimée');}

// ══════════════════════════════════════════════════
// EXPORT FEUILLE D'HEURES MENSUELLE
// ══════════════════════════════════════════════════
function exportHeuresMensuel(eid){const e=D.employes.find(x=>x.id===eid);if(!e)return;const now=new Date();const mois=now.getMonth();const annee=now.getFullYear();const moisNom=now.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});const ptgs=(D.pointages||[]).filter(p=>p.eid===eid&&p.arrivee&&p.depart).filter(p=>{const d=new Date(p.date);return d.getMonth()===mois&&d.getFullYear()===annee;}).sort((a,b)=>a.date.localeCompare(b.date));let totalH=0;ptgs.forEach(p=>{totalH+=calcHeures(p.arrivee,p.depart);});const heuresContrat=e.heures||0;const heuresMensuelles=heuresContrat*4.33;const heureSup=totalH>heuresMensuelles?totalH-heuresMensuelles:0;const lignes=ptgs.map(p=>{const h=calcHeures(p.arrivee,p.depart);const d=new Date(p.date);const jourNom=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});return`<tr><td>${jourNom}</td><td>${p.arrivee}</td><td>${p.depart}</td><td style="font-weight:700;color:#FF6B35">${heuresTxt(h)}</td><td style="color:#666">${p.note||''}</td></tr>`;}).join('');const html=`<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Feuille d'heures — ${e.nom}</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#222;font-size:13px}h1{font-size:20px;margin-bottom:4px}h2{font-size:14px;color:#666;font-weight:normal;margin-bottom:20px}table{width:100%;border-collapse:collapse;margin-bottom:20px}th{background:#f5f5f5;padding:8px 10px;text-align:left;font-size:11px;text-transform:uppercase;color:#888;border-bottom:2px solid #ddd}td{padding:9px 10px;border-bottom:1px solid #eee}.total{background:#fff8f5;font-weight:700;font-size:14px}.badge{background:#FF6B35;color:#fff;border-radius:6px;padding:2px 8px;font-size:11px}.footer{margin-top:30px;padding-top:20px;border-top:1px solid #ddd;color:#888;font-size:11px;display:flex;justify-content:space-between}@media print{.no-print{display:none}}</style></head><body>
<div class="no-print" style="display:flex;gap:10px;margin-bottom:20px"><button onclick="window.close()" style="background:#f0f0f0;color:#333;border:none;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer">‹ Fermer</button><button onclick="window.print()" style="background:#FF6B35;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer">🖨️ Imprimer</button></div>
<h1>${e.emoji||'👤'} ${e.nom} — Feuille d'heures</h1>
<h2>${e.poste} · ${e.contrat} · ${heuresContrat}h/semaine · <span style="text-transform:capitalize">${moisNom}</span></h2>
<table><thead><tr><th>Date</th><th>Arrivée</th><th>Départ</th><th>Heures</th><th>Note</th></tr></thead><tbody>${lignes.length>0?lignes:'<tr><td colspan="5" style="color:#888;text-align:center;padding:20px">Aucun pointage ce mois</td></tr>'}</tbody>
<tfoot><tr class="total"><td colspan="3">TOTAL du mois</td><td style="color:#FF6B35">${heuresTxt(totalH)}</td><td>${heureSup>0?`<span class="badge">+${heuresTxt(heureSup)} sup</span>`:''}</td></tr></tfoot></table>
<div class="footer"><div>Contrat : ${heuresContrat}h/semaine · ${(heuresContrat*4.33).toFixed(0)}h/mois estimé</div><div>Généré le ${new Date().toLocaleDateString('fr-FR')} · Gest'O</div></div>
<div style="margin-top:20px;padding:12px;border:1px solid #ddd;border-radius:8px"><div style="font-size:11px;color:#888;margin-bottom:6px">Signature employé</div><div style="height:40px;border-bottom:1px solid #999"></div></div>
</body></html>`;const w=window.open('','_blank');w.document.write(html);w.document.close();}

function openDrawer(){const d=document.getElementById('drawer');const o=document.getElementById('ov');if(!d||!o)return;const rn=document.getElementById('dr-resto-name');if(rn&&typeof S!=='undefined'&&S&&S.nom)rn.textContent=S.nom;document.querySelectorAll('.dr-btn').forEach(b=>b.classList.remove('act'));const cur=typeof N!=='undefined'&&N&&N.t?N.t:'dashboard';const ab=document.querySelector(`.dr-btn[data-tab="${cur}"]`);if(ab)ab.classList.add('act');d.classList.add('open');o.classList.add('open');document.body.style.overflow='hidden';}
function closeDrawer(){const d=document.getElementById('drawer');const o=document.getElementById('ov');if(d)d.classList.remove('open');if(o)o.classList.remove('open');document.body.style.overflow='';}
function toggleDrawer(){const d=document.getElementById('drawer');if(d&&d.classList.contains('open'))closeDrawer();else openDrawer();}
function drGo(tab){if(typeof go==='function')go(tab);closeDrawer();}
function avancerLivraison(bonId){if(window._advancing)return;window._advancing=true;setTimeout(()=>{window._advancing=false;},1000);const b=(D.bons_commande||[]).find(x=>x.id===bonId);if(!b)return;const ordre=['créé','envoyé','livré','vérifié'];const idx=ordre.indexOf(b.statut||'créé');if(idx<ordre.length-1){b.statut=ordre[idx+1];save();render();toast(idx===0?'📤 Bon marqué comme envoyé':idx===1?'📦 Livraison reçue !':'✅ Livraison vérifiée !');}}</script>
</body>
</html>
