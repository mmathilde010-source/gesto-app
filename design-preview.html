<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RestoApp — Aperçu Mobile</title>
<style>
body {
  margin: 0; background: #111;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 100vh; padding: 20px;
}
.hint { color: #555; font-size: 11px; font-weight: 600; margin-bottom: 10px; letter-spacing: 0.3px; }
@media (max-width: 430px) {
  body { padding: 0; background: #0d0d0d; justify-content: flex-start; }
  .hint { display: none; }
}

.phone {
  width: 390px; height: 844px;
  background: #0d0d0d;
  border-radius: 44px; border: 8px solid #2a2a2a;
  box-shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 0 1px #333;
  overflow: hidden; position: relative; flex-shrink: 0;

  --bg:  #0d0d0d; --bg2: #141414; --bg3: #1c1c1e; --bg4: #242426;
  --brd: #2a2a2e; --brd2: #333338;
  --txt: #f0ede8; --t2: #9a9aa0; --t3: #505058;
  --acc: #FF6B35; --acc2: #FF3366;
  --grn: #4CAF50; --amb: #FFB347; --red: #ff4444;
  color: var(--txt); font-size: 14px;
}
@media (max-width: 430px) {
  .phone { width: 100%; height: 100dvh; border-radius: 0; border: none; box-shadow: none; }
}
.phone *, .phone *::before, .phone *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
.phone button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
.phone a { text-decoration: none; }

/* ── App shell ── */
.app { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; position: relative; }

/* ── Overlay ── */
#ov { position: absolute; inset: 0; background: rgba(0,0,0,0); z-index: 90; pointer-events: none; transition: background .25s; }
#ov.open { background: rgba(0,0,0,.65); pointer-events: all; backdrop-filter: blur(1px); }

/* ── DRAWER ── */
#drawer {
  position: absolute; top: 0; left: 0; bottom: 0; width: 280px;
  background: var(--bg2); border-right: 1px solid var(--brd);
  z-index: 100; display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform .28s cubic-bezier(.32,.72,0,1);
}
#drawer.open { transform: translateX(0); }

.dr-brand { display: flex; align-items: center; gap: 10px; padding: 48px 16px 14px; border-bottom: 1px solid var(--brd); flex-shrink: 0; }
.dr-logo { width: 36px; height: 36px; background: linear-gradient(135deg,#FF6B35,#FF3366); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; box-shadow: 0 4px 14px rgba(255,107,53,.3); }
.dr-name { font-size: 11px; font-weight: 900; color: var(--t3); letter-spacing: .5px; }
.dr-name span { color: var(--acc); }
.dr-resto { font-size: 15px; font-weight: 800; color: var(--txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.dr-nav { flex: 1; overflow-y: auto; padding: 8px 10px 12px; scrollbar-width: none; }
.dr-nav::-webkit-scrollbar { display: none; }
.dr-gl { font-size: 9px; font-weight: 800; color: var(--t3); text-transform: uppercase; letter-spacing: 1.5px; padding: 13px 8px 4px; }

.dr-btn {
  display: flex; align-items: center; gap: 11px; padding: 9px 10px;
  border-radius: 11px; color: var(--t2); font-size: 13px; font-weight: 600;
  width: 100%; text-align: left; position: relative;
  transition: background .12s, color .12s;
}
.dr-btn:active { background: var(--bg4); }
.dr-btn.act { background: rgba(255,107,53,.1); color: var(--acc); font-weight: 700; }
.dr-btn.act::before { content:''; position:absolute; left:0; top:22%; bottom:22%; width:3px; border-radius:0 2px 2px 0; background:var(--acc); }
.dr-ico { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 15px; flex-shrink: 0; }
.dr-btn.act .dr-ico { background: rgba(255,107,53,.12); }
.dr-badge { margin-left: auto; background: var(--red); color: #fff; font-size: 9px; font-weight: 900; min-width: 16px; height: 16px; border-radius: 999px; padding: 0 4px; display: flex; align-items: center; justify-content: center; }
.dr-badge.am { background: var(--amb); color: #111; }
.dr-sep { height: 1px; background: var(--brd); margin: 5px 8px; }
.dr-foot { padding: 10px; border-top: 1px solid var(--brd); flex-shrink: 0; }
.dr-deco { width: 100%; padding: 10px 12px; background: rgba(255,107,53,.06); border: 1px solid rgba(255,107,53,.15); border-radius: 11px; color: var(--acc); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

/* ── HEADER ── */
#hdr { display: flex; align-items: center; padding: 46px 14px 11px; background: var(--bg2); border-bottom: 1px solid var(--brd); gap: 10px; flex-shrink: 0; z-index: 10; }
.hdr-l { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; }
.ham { width: 36px; height: 36px; background: var(--bg3); border: 1px solid var(--brd); border-radius: 10px; font-size: 15px; color: var(--txt); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.hdr-lbl { font-size: 11px; font-weight: 900; color: var(--t3); letter-spacing: .4px; }
.hdr-lbl span { color: var(--acc); }
.hdr-sub { font-size: 17px; font-weight: 800; color: var(--txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-r { display: flex; gap: 6px; flex-shrink: 0; }
.hdr-ic { width: 36px; height: 36px; background: var(--bg3); border: 1px solid var(--brd); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; position: relative; }
.hdr-dot { width: 7px; height: 7px; background: var(--red); border-radius: 50%; border: 2px solid var(--bg2); position: absolute; top: -2px; right: -2px; }

/* ── CONTENT ── */
#mc { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 16px 4px; scrollbar-width: none; }
#mc::-webkit-scrollbar { display: none; }

/* ── BOTTOM NAV ── */
#bn { display: flex; background: var(--bg2); border-top: 1px solid var(--brd); padding: 8px 0 20px; flex-shrink: 0; }
.nb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px 0; color: var(--t3); font-size: 8px; font-weight: 700; position: relative; }
.nb.act { color: var(--acc); }
.nb .ni { font-size: 20px; }
.nb-dot { width: 4px; height: 4px; background: var(--acc); border-radius: 50%; margin-top: 1px; }
.nb-al { position: absolute; top: 1px; right: calc(50% - 16px); width: 7px; height: 7px; border-radius: 50%; border: 2px solid var(--bg2); }

/* ── Helpers ── */
.slabel { font-size: 9px; font-weight: 800; color: var(--t3); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
.card { background: var(--bg3); border: 1px solid var(--brd); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
.ch { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
.ct { font-size: 9px; font-weight: 800; color: var(--t3); text-transform: uppercase; letter-spacing: 1px; }
.clink { font-size: 11px; color: var(--acc); font-weight: 700; }
.badge { font-size: 9px; font-weight: 800; padding: 3px 7px; border-radius: 999px; }
.bg { background: rgba(76,175,80,.1); color: var(--grn); border: 1px solid rgba(76,175,80,.2); }
.ba { background: rgba(255,179,71,.1); color: var(--amb); border: 1px solid rgba(255,179,71,.2); }
.br { background: rgba(255,68,68,.1);  color: var(--red); border: 1px solid rgba(255,68,68,.2); }
.row { display: flex; justify-content: space-between; align-items: center; }
.li { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--brd); }
.li:last-child { border-bottom: none; padding-bottom: 0; }
.lav { width: 34px; height: 34px; background: var(--bg4); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.linf { flex: 1; min-width: 0; }
.ln { font-size: 13px; font-weight: 700; color: var(--txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ls { font-size: 10px; color: var(--t3); margin-top: 1px; }
.lamt { font-size: 13px; font-weight: 800; color: var(--txt); flex-shrink: 0; }
.btn-p { background: linear-gradient(135deg,#FF6B35,#FF3366); border: none; border-radius: 12px; padding: 13px 16px; color: #fff; font-size: 13px; font-weight: 800; width: 100%; margin-bottom: 8px; cursor: pointer; }
.btn-o { background: transparent; border: 1px solid var(--brd); border-radius: 12px; padding: 13px 16px; color: var(--txt); font-size: 13px; font-weight: 700; width: 100%; margin-bottom: 8px; cursor: pointer; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.sc { background: var(--bg3); border: 1px solid var(--brd); border-radius: 16px; padding: 14px; }
.sv { font-size: 20px; font-weight: 900; letter-spacing: -.5px; margin: 5px 0 2px; }
.sl { font-size: 9px; color: var(--t3); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.input { width: 100%; background: var(--bg2); border: 1px solid var(--brd); border-radius: 12px; padding: 12px 14px; color: var(--txt); font-size: 14px; margin-bottom: 10px; outline: none; font-family: inherit; }
.input:focus { border-color: var(--acc); }
.stabs { display: flex; gap: 7px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.stabs::-webkit-scrollbar { display: none; }
.stab { flex-shrink: 0; background: var(--bg3); border: 1px solid var(--brd); border-radius: 10px; padding: 8px 14px; color: var(--t3); font-size: 11px; font-weight: 700; cursor: pointer; }
.stab.act { background: var(--acc); border-color: var(--acc); color: #fff; }
.bbar { background: var(--bg4); border-radius: 4px; height: 5px; overflow: hidden; margin-top: 4px; }
.bfill { height: 5px; border-radius: 4px; }
.alert-s { display: flex; align-items: center; gap: 11px; border-radius: 13px; padding: 11px 13px; margin-bottom: 8px; cursor: pointer; }
.alert-s.r { background: rgba(255,68,68,.07); border: 1px solid rgba(255,68,68,.18); }
.alert-s.a { background: rgba(255,179,71,.07); border: 1px solid rgba(255,179,71,.18); }
.alert-s.g { background: rgba(76,175,80,.07); border: 1px solid rgba(76,175,80,.18); }
.at { font-size: 12px; font-weight: 700; }
.r .at { color: var(--red); } .a .at { color: var(--amb); } .g .at { color: var(--grn); }
.as { font-size: 10px; color: var(--t3); margin-top: 1px; }
.bar-chart { display: flex; align-items: flex-end; gap: 5px; height: 50px; margin-bottom: 4px; }
.bc { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bf { width: 100%; border-radius: 3px 3px 0 0; background: rgba(255,107,53,.2); min-height: 4px; }
.bf.cur { background: var(--acc); }
.bl { font-size: 8px; color: var(--t3); font-weight: 600; }
.sep { height: 1px; background: var(--brd); margin: 10px 0; }
/* FAB */
.fab { position: absolute; bottom: 90px; right: 16px; width: 48px; height: 48px; background: linear-gradient(135deg,#FF6B35,#FF3366); border-radius: 50%; border: none; font-size: 22px; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(255,107,53,.45); z-index: 5; cursor: pointer; }
</style>
</head>
<body>
<div class="hint">☰ = ouvrir le menu · onglets bas = navigation principale</div>
<div class="phone">
<div class="app">

<!-- Overlay -->
<div id="ov" onclick="closeDrawer()"></div>

<!-- ════ DRAWER ════ -->
<nav id="drawer">
  <div class="dr-brand">
    <div class="dr-logo">🍽️</div>
    <div>
      <div class="dr-name">Resto<span>App</span></div>
      <div class="dr-resto">Mon Restaurant</div>
    </div>
  </div>
  <div class="dr-nav">
    <button class="dr-btn act" onclick="go('dashboard',this)"><div class="dr-ico">⚡</div>Tableau de bord</button>
    <div class="dr-gl">Activité</div>
    <button class="dr-btn" onclick="go('commandes',this)"><div class="dr-ico">📦</div>Commandes<span class="dr-badge am">3</span></button>
    <button class="dr-btn" onclick="go('fournisseurs',this)"><div class="dr-ico">🏪</div>Fournisseurs</button>
    <button class="dr-btn" onclick="go('factures',this)"><div class="dr-ico">🧾</div>Factures<span class="dr-badge">2</span></button>
    <div class="dr-gl">Cuisine & Bar</div>
    <button class="dr-btn" onclick="go('cuisine',this)"><div class="dr-ico">🍳</div>Cuisine</button>
    <button class="dr-btn" onclick="go('bar',this)"><div class="dr-ico">🍷</div>Bar</button>
    <div class="dr-gl">Stocks & Qualité</div>
    <button class="dr-btn" onclick="go('stocks',this)"><div class="dr-ico">📦</div>Stocks<span class="dr-badge">4</span></button>
    <button class="dr-btn" onclick="go('temp',this)"><div class="dr-ico">🌡️</div>Températures</button>
    <button class="dr-btn" onclick="go('tracabilite',this)"><div class="dr-ico">🏷️</div>Traçabilité</button>
    <div class="dr-gl">Équipe</div>
    <button class="dr-btn" onclick="go('equipe',this)"><div class="dr-ico">👥</div>Équipe</button>
    <button class="dr-btn" onclick="go('pointages',this)"><div class="dr-ico">📍</div>Pointages</button>
    <button class="dr-btn" onclick="go('recettes',this)"><div class="dr-ico">🍽️</div>Recettes</button>
    <button class="dr-btn" onclick="go('notes',this)"><div class="dr-ico">📢</div>Notes service</button>
    <div class="dr-gl">Administration</div>
    <button class="dr-btn" onclick="go('business',this)"><div class="dr-ico">🏢</div>Business</button>
    <button class="dr-btn" onclick="go('comptable',this)"><div class="dr-ico">📊</div>Comptable</button>
    <button class="dr-btn" onclick="go('import',this)"><div class="dr-ico">📥</div>Import CSV</button>
    <button class="dr-btn" onclick="go('messages',this)"><div class="dr-ico">✉️</div>Messages</button>
    <div class="dr-sep"></div>
    <button class="dr-btn" onclick="go('sav',this)"><div class="dr-ico">💬</div>Support</button>
  </div>
  <div class="dr-foot">
    <button class="dr-deco">🚪 Se déconnecter</button>
  </div>
</nav>

<!-- ════ HEADER ════ -->
<header id="hdr">
  <div class="hdr-l">
    <button class="ham" onclick="toggleDrawer()">☰</button>
    <div>
      <div class="hdr-lbl">Resto<span>App</span></div>
      <div class="hdr-sub" id="hsub">Mon Restaurant</div>
    </div>
  </div>
  <div class="hdr-r">
    <div class="hdr-ic">🔔<span class="hdr-dot"></span></div>
    <div class="hdr-ic" style="font-size:18px">≡</div>
  </div>
</header>

<!-- ════ CONTENT ════ -->
<div id="mc"></div>

<!-- ════ BOTTOM NAV ════ -->
<nav id="bn">
  <button class="nb act" id="bn-dashboard" onclick="go('dashboard',this,'bn')"><span class="ni">⚡</span><span>Accueil</span><div class="nb-dot"></div></button>
  <button class="nb" id="bn-commandes" onclick="go('commandes',this,'bn')" style="position:relative"><span class="ni">📦</span><span>Commandes</span><span class="nb-al" style="background:var(--amb)"></span></button>
  <button class="nb" id="bn-factures" onclick="go('factures',this,'bn')" style="position:relative"><span class="ni">🧾</span><span>Factures</span><span class="nb-al" style="background:var(--red)"></span></button>
  <button class="nb" id="bn-pointages" onclick="go('pointages',this,'bn')"><span class="ni">📍</span><span>Pointages</span></button>
  <button class="nb" id="bn-equipe" onclick="go('equipe',this,'bn')"><span class="ni">👥</span><span>Équipe</span></button>
</nav>

</div><!-- /app -->
</div><!-- /phone -->

<script>
/* ═══ Pages ═══════════════════════════════════════════════════════ */
const PAGES = {

dashboard: `
<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px">
  <div>
    <div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:capitalize">dimanche 29 juin 2026</div>

  </div>

factures: `

</div>
<div class="slabel">Juin 2026 — 3 factures · 1 810 €</div>
${[['🥩','Boucherie Centrale','F-2026-001','24 mai 2026','850 €','bg','Payée'],['🥦','Les Jardins Verts','F-2026-002','22 mai 2026','340 €','ba','En attente'],['🍷','Cave du Sommelier','BC-2026-001','20 mai 2026','620 €','ba','Bon cmd']].map(([i,n,num,d,a,b,s])=>`

/* ═══ Routing ═══════════════════════════════════════════════════════ */
let curPage = 'dashboard';

const PAGE_TITLES = {
  dashboard:'Mon Restaurant', factures:'Factures', fournisseurs:'Fournisseurs',
  stocks:'Stocks', equipe:'Équipe', pointages:'Pointages', commandes:'Commandes',
  cuisine:'Cuisine', bar:'Bar', business:'Business', comptable:'Comptable',
  temp:'Températures', tracabilite:'Traçabilité', recettes:'Recettes',
  notes:'Notes service', import:'Import CSV', messages:'Messages', sav:'Support'
};

function go(page, srcBtn, srcType) {
  if (!PAGES[page]) return;
  curPage = page;

  // Content
  document.getElementById('mc').innerHTML = PAGES[page];

  // Header subtitle
  document.getElementById('hsub').textContent = PAGE_TITLES[page] || page;

  // Drawer active
  document.querySelectorAll('.dr-btn').forEach(b => b.classList.remove('act'));
  const drBtn = document.querySelector(`.dr-btn[onclick*="'${page}'"]`);
  if (drBtn) drBtn.classList.add('act');

  // Bottom nav active
  document.querySelectorAll('.nb').forEach(b => {
    b.classList.remove('act');
    b.querySelectorAll('.nb-dot').forEach(d => d.remove());
  });
  const bnBtn = document.getElementById('bn-'+page);
  if (bnBtn) {
    bnBtn.classList.add('act');
    const dot = document.createElement('div');
    dot.className = 'nb-dot';
    bnBtn.appendChild(dot);
  }

  // Scroll top
  document.getElementById('mc').scrollTop = 0;

  // Close drawer
  closeDrawer();
}

function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('ov').classList.toggle('open');
}
